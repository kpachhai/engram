# Planning Vocabulary Pattern Set - Canonical Source
#
# Flags process/planning vocabulary that pollutes shipped artifacts.
# Sister tool to pii-patterns.conf - same scanner shape, different target.
#
# Project CLAUDE.md rule "No Phase/Layer References in Code" lives in
# idea-forge. This scanner enforces it across any repo.
#
# Each non-comment, non-blank line is an extended regex (ERE).
# Lines starting with `#` are comments. Blank lines are ignored.
#
# Bypass markers (per-line):
#   - `vocab-allow` on the same line - skip this occurrence
#   - File-path allowlist - see planning-vocab-scan.sh ALLOW_PATH_PATTERNS
#
# What this scanner DOES flag:
#   - "iteration N" / "iter-N" - planning-cycle vocabulary
#   - "Phase N" / "Phase Nb" - planning-cycle vocabulary
#   - "F<N>" / "F<N>.<M>" - feature-numbering vocabulary (F4, F5.4, F6)
#   - "T-pre" / "T<N>" - task-numbering vocabulary
#
# What this scanner does NOT flag (technical feature names, not planning):
#   - "Strategy 2/3/4" - keep, these are technical strategy names
#   - "Mechanism A/B" - keep, these are technical mechanism names
#   - "Layer N" in n-layer architecture - context-dependent, may need vocab-allow
#
# Cleanup pattern (manual): rewrite WHY without WHEN.
#   Before: "F6 (iteration 6): release-attribution credit"
#   After:  "release-attribution: a PR merged before window can be attributed
#           to a release in-window"

# === Iteration vocabulary ===
[Ii]teration[- ][0-9]+
iter-[0-9]+
iter-[0-9]+-aware

# === Phase vocabulary (planning-cycle Phase N, not architectural phase) ===
Phase [0-9]+[a-z]?

# === F-number feature vocabulary (F4, F5, F5.4, F6) ===
# Capped at 2 digits: real feature labels are F1-F99. Unbounded digits
# false-positive on hex color values like F87171 (seen in DESIGN.md palettes).
\bF[0-9]{1,2}(\.[0-9]+)?\b

# === T-task vocabulary ===
T-pre
T-post
\bT[0-9]{1,2}\b

# === Composite planning artifacts ===
deep-plan
critique [A-Z][0-9]+
Amendment [0-9]+
closes [A-Z][0-9]+
