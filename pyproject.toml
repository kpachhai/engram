[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "engram-mcp"
version = "0.1.0"
description = "Personal AI memory backend - portable, sovereign, protocol-compatible (MCP server with markdown source-of-truth and local vector search)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Kiran Pachhai" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-memory",
  "embeddings",
  "sqlite-vec",
  "fastembed",
  "markdown",
  "byoc",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=2.0",
  "fastembed>=0.7",
  "sqlite-vec>=0.1.6",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "typer>=0.12",
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  "uuid7>=0.1",
  # Pin onnxruntime under 1.21: 1.20.x is the last release that ships
  # macOS x86_64 (Intel Mac) wheels. Engram explicitly supports Intel Macs
  # for the work-laptop deployment scenario; revisit when Intel Mac stops
  # being a target.
  "onnxruntime>=1.17,<1.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[project.scripts]
engram = "engram.cli:app"

[project.urls]
Repository = "https://github.com/kpachhai/engram"
Issues = "https://github.com/kpachhai/engram/issues"
Changelog = "https://github.com/kpachhai/engram/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.hatch.build.targets.sdist]
include = [
  "src/engram",
  "tests",
  "docs",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]
extend-exclude = [
  "docs/superpowers",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "ANN",  # flake8-annotations
  "D",    # pydocstyle
  "S",    # flake8-bandit (security)
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "PTH",  # flake8-use-pathlib
]
ignore = [
  "D100",  # missing module docstrings (re-enable when documentation matures)
  "D104",  # missing package docstrings
  "D203",  # 1 blank line before class - conflicts with D211
  "D213",  # multi-line summary at second line - conflicts with D212
  "ANN401", # Any in **kwargs - sometimes necessary at framework boundaries
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert (S101), fake secret-shaped strings to
# exercise redaction (S105/S106/S107), and have looser annotation/docstring
# requirements (ANN/D).
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "S108", "ANN", "D"]
"bench/**/*.py" = ["S101", "ANN", "D"]
"docs/**/*.py" = ["S101", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
  "fastembed.*",
  "sqlite_vec.*",
  "ruamel.*",
  "uuid_extensions.*",
]
ignore_missing_imports = true

# Tests can skip annotation strictness; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "slow: tests that take longer than ~1 second to run",
  "integration: tests that exercise real FastEmbed or SQLite",
  "e2e: end-to-end tests that spawn engram serve as a subprocess",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/engram"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
show_missing = true
