name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow uses only controlled inputs (matrix values + standard GitHub-provided
# refs); no untrusted user input is interpolated into shell `run:` blocks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + Type-check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PY_VERSION"

      - name: Sync dependencies
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv sync --all-extras --dev --locked --python "$PY_VERSION"

      - name: Ruff format check
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" ruff format --check .

      - name: Ruff lint
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" ruff check .

      - name: Mypy strict
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" mypy

  gates:
    name: Repo gates (vendored-gate integrity, PII, planning vocabulary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so a pull_request base sha is resolvable for the
          # changed-files diff below.
          fetch-depth: 0

      # Hash-pin check plus a live detection probe. A hash match proves the
      # vendored scanner is unmodified; it cannot prove the scanner still
      # works, so the probe plants input each gate must flag.
      - name: Verify vendored gates
        run: ./.githooks/verify-gates.sh

      # Existing findings are frozen in .planning-vocab-baseline; only NEW
      # planning vocabulary fails. Paying debt down never breaks the build.
      - name: Planning-vocabulary ratchet
        run: ./.githooks/planning-vocab-ratchet.sh --check .

      # Scoped to files this ref changes, deliberately. The tree carries
      # pre-existing matches (synthetic key fixtures in tests, the LICENSE
      # attribution line), so a scan-everything job would be permanently red
      # and would be ignored within a week. This blocks NEW PII.
      - name: PII scan (changed files)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail
          base="${BASE_SHA:-}"
          # The all-zero sha git sends for a new branch fails cat-file too,
          # so an explicit comparison against that literal is redundant.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then base="HEAD~1"; else base=""; fi
          fi
          if [ -n "$base" ]; then
            FILES=(); while IFS= read -r -d '' f; do FILES+=("$f"); done \
              < <(git diff -z --name-only --diff-filter=ACMRT "$base" HEAD)
          else
            FILES=(); while IFS= read -r -d '' f; do FILES+=("$f"); done \
              < <(git show -z --name-only --diff-filter=ACMRT --format= HEAD)
          fi
          if [ "${#FILES[@]:-0}" -eq 0 ]; then
            echo "no changed files to scan"; exit 0
          fi
          printf 'scanning %s changed file(s)\n' "${#FILES[@]}"
          ./.githooks/pii-scan.sh "${FILES[@]}" < /dev/null

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Disable terminal coloring so help-output assertions are portable
      # across GHA runners (Typer + Rich render ANSI escapes by default
      # when a TTY is detected).
      NO_COLOR: "1"
      TERM: dumb
      COLUMNS: "200"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PY_VERSION"

      - name: Sync dependencies
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv sync --all-extras --dev --locked --python "$PY_VERSION"

      - name: Run pytest with coverage
        env:
          PY_VERSION: ${{ matrix.python-version }}
        # Deselects the one FastEmbed real-network round-trip, which depends
        # on a HuggingFace model download too flaky for CI. Selecting by
        # marker rather than ignoring the file keeps the other 21 tests in
        # that module - including the pinned model-hash manifest guards,
        # which an --ignore of the whole file silently dropped.
        run: |
          uv run --python "$PY_VERSION" pytest \
            --cov=engram \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not integration"

      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distribution
        run: uv build

      - name: Inspect dist artifacts
        run: |
          ls -la dist/
          test -f dist/engram_mcp_server-*.whl
          test -f dist/engram_mcp_server-*.tar.gz

      - name: Twine check (PEP 503 metadata validation)
        run: uv run --with twine python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  console-script-smoke:
    name: Console-script smoke (engram + python -m engram)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install built wheel into a clean venv + run smoke
        # Cross-checks that the dist artifact (not the editable source)
        # exposes both entry points. A regression where
        # ``engram/__main__.py`` was missing broke the proxy spawn
        # dance; this smoke catches that recurrence.
        run: |
          uv venv /tmp/smoke-venv
          source /tmp/smoke-venv/bin/activate
          uv pip install dist/engram_mcp_server-*.whl
          engram --version
          python -m engram --version
          engram daemon --help
          # Both invocations must report the same version.
          test "$(engram --version)" = "$(python -m engram --version)"
