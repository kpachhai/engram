name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow uses only controlled inputs (matrix values + standard GitHub-provided
# refs); no untrusted user input is interpolated into shell `run:` blocks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + Type-check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PY_VERSION"

      - name: Sync dependencies
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv sync --all-extras --dev --python "$PY_VERSION"

      - name: Ruff format check
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" ruff format --check .

      - name: Ruff lint
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" ruff check .

      - name: Mypy strict
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" mypy

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PY_VERSION"

      - name: Sync dependencies
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv sync --all-extras --dev --python "$PY_VERSION"

      - name: Run pytest with coverage
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: uv run --python "$PY_VERSION" pytest --cov=engram --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
